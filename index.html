<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>時間旅行控制台｜張昌量</title>

    <style>
        :root {
            --cyan: #5ffcff;
            --blue: #2878ff;
            --purple: #ad5cff;
            --dark: #020611;
            --glass: rgba(8, 22, 45, 0.58);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            color: white;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(40, 120, 255, 0.25), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(173, 92, 255, 0.18), transparent 35%),
                linear-gradient(145deg, #01030a, #04122a 55%, #020611);
        }

        /* 星空畫布 */
        #starCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 背景網格 */
        .grid {
            position: fixed;
            left: -50%;
            bottom: -55%;
            width: 200%;
            height: 110%;
            z-index: 1;

            background-image:
                linear-gradient(rgba(95, 252, 255, 0.11) 1px, transparent 1px),
                linear-gradient(90deg, rgba(95, 252, 255, 0.11) 1px, transparent 1px);

            background-size: 60px 60px;
            transform: perspective(450px) rotateX(65deg);
            animation: gridMove 8s linear infinite;
            mask-image: linear-gradient(to top, black, transparent 72%);
        }

        @keyframes gridMove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 60px;
            }
        }

        /* 主畫面 */
        .app {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            padding: 32px;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 3px;
            font-size: 13px;
        }

        .brand {
            color: var(--cyan);
            font-weight: bold;
            text-shadow: 0 0 14px var(--cyan);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #54ffaa;
            box-shadow: 0 0 14px #54ffaa;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.35;
            }
        }

        .layout {
            flex: 1;
            width: min(1100px, 100%);
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1.35fr 1fr;
            gap: 22px;
            align-items: center;
        }

        .panel {
            position: relative;
            padding: 25px;
            border: 1px solid rgba(95, 252, 255, 0.25);
            border-radius: 22px;
            background: var(--glass);
            backdrop-filter: blur(18px);
            box-shadow:
                inset 0 0 30px rgba(95, 252, 255, 0.04),
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .panel::before,
        .panel::after {
            content: "";
            position: absolute;
            width: 32px;
            height: 32px;
            pointer-events: none;
        }

        .panel::before {
            top: -1px;
            left: -1px;
            border-top: 2px solid var(--cyan);
            border-left: 2px solid var(--cyan);
            border-radius: 20px 0 0 0;
        }

        .panel::after {
            right: -1px;
            bottom: -1px;
            border-right: 2px solid var(--cyan);
            border-bottom: 2px solid var(--cyan);
            border-radius: 0 0 20px 0;
        }

        .panel-title {
            margin-bottom: 22px;
            color: var(--cyan);
            font-size: 12px;
            letter-spacing: 3px;
        }

        .data-row {
            margin: 17px 0;
        }

        .data-label {
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 2px;
        }

        .data-value {
            font-size: 20px;
            font-weight: bold;
        }

        .bar {
            height: 6px;
            margin-top: 9px;
            overflow: hidden;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
        }

        .bar-value {
            width: 86%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--blue), var(--cyan));
            box-shadow: 0 0 14px var(--cyan);
            animation: energy 2.6s ease-in-out infinite alternate;
        }

        @keyframes energy {
            from {
                width: 74%;
            }

            to {
                width: 92%;
            }
        }

        /* 中央時間核心 */
        .core-panel {
            text-align: center;
            padding: 38px 26px;
        }

        .core {
            position: relative;
            width: 270px;
            height: 270px;
            margin: 0 auto 25px;
            display: grid;
            place-items: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(95, 252, 255, 0.4);
        }

        .ring-1 {
            inset: 0;
            border-top: 3px solid var(--cyan);
            border-bottom: 3px solid transparent;
            animation: spin 8s linear infinite;
        }

        .ring-2 {
            inset: 22px;
            border-left: 2px solid var(--purple);
            border-right: 2px solid transparent;
            animation: spinReverse 5s linear infinite;
        }

        .ring-3 {
            inset: 48px;
            border: 1px dashed rgba(95, 252, 255, 0.55);
            animation: spin 12s linear infinite;
        }

        .ring-4 {
            inset: 70px;
            background:
                radial-gradient(circle, rgba(95, 252, 255, 0.28), rgba(40, 120, 255, 0.05) 60%, transparent);
            box-shadow:
                inset 0 0 30px rgba(95, 252, 255, 0.25),
                0 0 45px rgba(40, 120, 255, 0.25);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spinReverse {
            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes pulse {
            50% {
                transform: scale(1.08);
                box-shadow:
                    inset 0 0 40px rgba(95, 252, 255, 0.42),
                    0 0 65px rgba(40, 120, 255, 0.45);
            }
        }

        .year-display {
            position: relative;
            z-index: 2;
        }

        .year-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 10px;
            letter-spacing: 3px;
        }

        #yearNumber {
            color: white;
            font-size: 52px;
            font-weight: 700;
            text-shadow:
                0 0 8px var(--cyan),
                0 0 30px var(--blue);
        }

        .year-picker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .year-picker button {
            width: 42px;
            height: 42px;
            border: 1px solid rgba(95, 252, 255, 0.45);
            border-radius: 12px;
            color: var(--cyan);
            background: rgba(95, 252, 255, 0.08);
            cursor: pointer;
            font-size: 20px;
            transition: 0.25s;
        }

        .year-picker button:hover {
            color: #00121a;
            background: var(--cyan);
            box-shadow: 0 0 25px rgba(95, 252, 255, 0.75);
            transform: translateY(-2px);
        }

        .year-input {
            width: 125px;
            padding: 11px;
            border: 1px solid rgba(95, 252, 255, 0.38);
            border-radius: 12px;
            outline: none;
            color: white;
            text-align: center;
            font-size: 19px;
            background: rgba(0, 0, 0, 0.25);
        }

        .travel-button {
            position: relative;
            width: 100%;
            padding: 16px 24px;
            overflow: hidden;
            border: 1px solid var(--cyan);
            border-radius: 13px;
            color: var(--cyan);
            background: rgba(95, 252, 255, 0.07);
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 4px;
            transition: 0.3s;
        }

        .travel-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.6),
                transparent
            );
            transform: skewX(-25deg);
            transition: 0.65s;
        }

        .travel-button:hover::before {
            left: 150%;
        }

        .travel-button:hover {
            color: #001018;
            background: var(--cyan);
            box-shadow:
                0 0 20px rgba(95, 252, 255, 0.5),
                0 0 50px rgba(40, 120, 255, 0.35);
        }

        .identity {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 22px;
            padding-top: 19px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border: 1px solid var(--cyan);
            border-radius: 50%;
            color: var(--cyan);
            font-weight: bold;
            box-shadow: 0 0 17px rgba(95, 252, 255, 0.28);
        }

        .identity-name {
            font-weight: bold;
        }

        .identity-school {
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .log {
            height: 148px;
            overflow: hidden;
            color: rgba(203, 248, 255, 0.72);
            font-family: Consolas, monospace;
            font-size: 11px;
            line-height: 1.85;
        }

        .log p::before {
            content: ">";
            margin-right: 7px;
            color: var(--cyan);
        }

        /* 穿越動畫 */
        .warp {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            visibility: hidden;
            opacity: 0;
            background: radial-gradient(circle, #ffffff, #5ffcff 6%, #2878ff 18%, #020611 60%);
            transition: 0.3s;
        }

        .warp.active {
            visibility: visible;
            opacity: 1;
            animation: warpFlash 2.6s ease-in-out forwards;
        }

        @keyframes warpFlash {
            0% {
                filter: brightness(0.5);
                transform: scale(0.2) rotate(0deg);
            }

            45% {
                filter: brightness(2.8);
                transform: scale(2.5) rotate(180deg);
            }

            75% {
                filter: brightness(6);
                transform: scale(5) rotate(360deg);
            }

            100% {
                filter: brightness(1);
                transform: scale(1) rotate(360deg);
            }
        }

        .warp-message {
            padding: 28px 38px;
            border: 1px solid white;
            border-radius: 14px;
            text-align: center;
            text-shadow: 0 0 16px white;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
        }

        .warp-message h2 {
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        footer {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.35);
            font-size: 10px;
            letter-spacing: 2px;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .app {
                padding: 20px;
            }

            .layout {
                grid-template-columns: 1fr;
                margin: 45px auto;
            }

            .core {
                width: 230px;
                height: 230px;
            }

            header,
            footer {
                gap: 16px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <canvas id="starCanvas"></canvas>
    <div class="grid"></div>

    <main class="app">

        <header>
            <div class="brand">TEMPORAL LAB 0310</div>

            <div class="status">
                <span class="status-dot"></span>
                <span>系統連線正常</span>
            </div>

            <div id="clock">00:00:00</div>
        </header>

        <section class="layout">

            <!-- 左側資訊面板 -->
            <aside class="panel">

                <div class="panel-title">TEMPORAL INFORMATION</div>

                <div class="data-row">
                    <div class="data-label">目前年份</div>
                    <div class="data-value" id="currentYear"></div>
                </div>

                <div class="data-row">
                    <div class="data-label">目的年份</div>
                    <div class="data-value destination-text">2050</div>
                </div>

                <div class="data-row">
                    <div class="data-label">時間距離</div>
                    <div class="data-value" id="yearDistance">24 年</div>
                </div>

                <div class="data-row">
                    <div class="data-label">時空能源</div>
                    <div class="data-value">86%</div>
                    <div class="bar">
                        <div class="bar-value"></div>
                    </div>
                </div>

                <div class="identity">
                    <div class="avatar">張</div>

                    <div>
                        <div class="identity-name">張昌量</div>
                        <div class="identity-school">長庚大學</div>
                    </div>
                </div>

            </aside>

            <!-- 中央控制台 -->
            <section class="panel core-panel">

                <div class="panel-title">TIME MACHINE CONTROL</div>

                <div class="core">

                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                    <div class="ring ring-4"></div>

                    <div class="year-display">
                        <div class="year-label">DESTINATION</div>
                        <div id="yearNumber">2050</div>
                    </div>

                </div>

                <div class="year-picker">
                    <button id="minusButton" aria-label="減少年份">−</button>

                    <input
                        id="yearInput"
                        class="year-input"
                        type="number"
                        value="2050"
                        min="1900"
                        max="3000"
                    >

                    <button id="plusButton" aria-label="增加年份">＋</button>
                </div>

                <button id="travelButton" class="travel-button">
                    啟動時間穿越
                </button>

            </section>

            <!-- 右側系統紀錄 -->
            <aside class="panel">

                <div class="panel-title">SYSTEM LOG</div>

                <div id="systemLog" class="log">
                    <p>量子核心初始化完成</p>
                    <p>時空座標同步完成</p>
                    <p>導航系統已啟動</p>
                    <p>等待選擇目的年份</p>
                </div>

                <div class="data-row">
                    <div class="data-label">量子穩定度</div>
                    <div class="data-value">99.8%</div>
                </div>

                <div class="data-row">
                    <div class="data-label">狀態
